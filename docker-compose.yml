name: proyecto_steam

services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    profiles: ["pipeline", "seed", "analytics"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/27017'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:15
    container_name: postgres_db
    profiles: ["pipeline", "seed"]
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: steam_data_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d steam_data_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: ./Data_analytics/mlflow
      dockerfile: Dockerfile
    container_name: steam_mlflow
    profiles: ["pipeline", "mlflow"]
    ports:
      - "5000:5000"
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steam_pipeline
    profiles: ["pipeline"]
    env_file:
      - ./Data_management/.env
      - ./Data_analytics/.env
    environment:
      PIPELINE_MODE: ${PIPELINE_MODE:-full}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      POSTGRES_HOST: postgres
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - ./Data_management:/app/Data_management
      - ./Data_analytics:/app/Data_analytics
    working_dir: /app

volumes:
  mongo_data:
  postgres_data:
