name: proyecto_steam

services:
  # --- MongoDB ---
  mongo:
    image: mongo:6.0
    container_name: mongo
    profiles: ["seed", "analytics"] # <-- Solo se inicia con los perfiles que lo necesitan
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/27017'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- PostgreSQL ---
  postgres:
    image: postgres:15
    container_name: postgres_db
    profiles: ["seed"] # Se inicia junto al pipeline de datos
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: steam_data_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d steam_data_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Job de sembrado (se ejecuta solo cuando tú quieras) ---
  app:
    build:
      context: ./Data_management
      dockerfile: Dockerfile
    container_name: data_management_pipeline
    volumes:
      # Mapeamos las carpetas que el pipeline necesita
      - ./Data_management/landing_zone:/app/landing_zone
      - ./Data_management/trusted_zone:/app/trusted_zone
      - ./Data_management/trusted_to_explotation:/app/trusted_to_explotation
      - ./logs:/app/logs # Mapeo para persistir los logs
    env_file:
      - ./Data_management/.env # Carga las variables de entorno, incluidas las de PostgreSQL
    environment:
      - MONGO_URI=mongodb://mongo:27017 # Se mantiene la configuración de Mongo
      - MONGO_DB=trusted_zone
      - RUN_MODE=app
      - POSTGRES_HOST=postgres # Se sobreescribe el host para la red de Docker
    depends_on:
      mongo:
        condition: service_healthy
      postgres: # Se añade la dependencia del nuevo servicio
        condition: service_healthy
    restart: "no"         # que haga su trabajo y termine
    profiles: ["seed"]    # <-- solo se incluye si activas el profile "seed"
    
  # --- MLflow ---
  mlflow:
    build:
      context: ./Data_analytics/mlflow
      dockerfile: Dockerfile
    container_name: steam_mlflow
    profiles: ["mlflow"] # <-- Solo se incluye si activas el profile "mlflow"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlruns
    restart: unless-stopped

  # --- Analytics (puede correr solo, con Mongo y opcionalmente MLflow) ---
  analytics:
    build:
      context: ./Data_analytics
      dockerfile: Dockerfile
    container_name: steam_analytics
    profiles: ["analytics"] # <-- Solo se incluye si activas el profile "analytics"
    env_file: ./Data_analytics/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      mongo:
        condition: service_healthy
      mlflow:
        condition: service_started    # quita esto si analytics no usa MLflow
    volumes:
      - ./:/app
      - analytics_outputs:/app/outputs
      - analytics_data:/app/data
      - analytics_models:/app/models
      - gcp_secrets:/secrets:ro
      - mlflow_data:/mlruns
    command: ["/bin/bash", "-lc", "sleep infinity"]
    # Aumentar memoria compartida para Ray (/dev/shm) y evitar que use /tmp
    shm_size: "4g"

volumes:
  mongo_data:
  postgres_data:
  gcp_secrets:
  analytics_outputs:
  analytics_data:
  analytics_models:
  mlflow_data:
