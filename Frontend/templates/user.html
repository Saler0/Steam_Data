{% extends "base.html" %}
{% block title %}Agregar Juego{% endblock %}
{% block content %}
<style>
    .form-container {
        max-width: 500px;
        margin: 40px auto;
        background: #23272f;
        padding: 2rem 2.5rem;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.15);
        color: #f5f6fa;
        font-family: "Segoe UI", Arial, sans-serif;
    }
    .form-container h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #00b894;
        letter-spacing: 1px;
    }
    .form-group {
        margin-bottom: 1.2rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #81ecec;
    }
    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 0.7rem;
        border: none;
        border-radius: 8px;
        background: #353b48;
        color: #f5f6fa;
        font-size: 1rem;
        transition: background 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
        background: #636e72;
        outline: none;
    }
    .form-group textarea {
        resize: vertical;
    }
    .submit-btn {
        width: 100%;
        padding: 0.9rem;
        background: linear-gradient(90deg, #00b894 60%, #0984e3 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 1rem;
        letter-spacing: 1px;
    }
    .submit-btn:hover {
        background: linear-gradient(90deg, #0984e3 60%, #00b894 100%);
    }
</style>
<div class="form-container">
    <h2>Describe tu juego</h2>
    <form method="post" action="{{ url_for('agregar_juego') }}">
        <div class="form-group">
            <label for="nombre">Nombre del juego</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej: Steam Adventure">
        </div>
        <div class="form-group">
            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" name="categoria" required placeholder="Ej: Accion, Estrategia">
        </div>
        <div class="form-group">
            <label for="descripcion">Descripcion</label>
            <textarea id="descripcion" name="descripcion" rows="4" required placeholder="Describe brevemente el juego..."></textarea>
        </div>
        <div class="form-group">
            <label for="precio">Precio</label>
            <input type="number" id="precio" name="precio" step="0.01" min="0" required placeholder="Ej: 19.99">
        </div>
        <button class="submit-btn" type="submit">Agregar</button>
    </form>
</div>
{% endblock %}
