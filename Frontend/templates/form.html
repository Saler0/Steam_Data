<!-- JS Dropdown y selección de chips -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.dropdown').forEach(dropdown => {
      const headerLabel = dropdown.querySelector('label');
      const content = dropdown.querySelector('.dropdown-content');
      const summary = headerLabel ? headerLabel.querySelector('.selected-summary') : null;
      const fieldName = dropdown.dataset.field;
      if (!content || !summary || !fieldName) {
        return;
      }

      const updateSummary = () => {
        const selectedValues = Array.from(content.querySelectorAll('input[type="checkbox"]:checked'))
          .map(input => input.value);
        summary.textContent = selectedValues.join(', ');
      };

      content.querySelectorAll('label').forEach(optionLabel => {
        const value = optionLabel.textContent.trim();
        optionLabel.textContent = '';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.name = fieldName;
        checkbox.value = value;
        const span = document.createElement('span');
        span.textContent = value;
        optionLabel.appendChild(checkbox);
        optionLabel.appendChild(span);
        optionLabel.classList.toggle('selected', checkbox.checked);
        checkbox.addEventListener('change', () => {
          optionLabel.classList.toggle('selected', checkbox.checked);
          updateSummary();
        });
      });

      headerLabel.addEventListener('click', event => {
        event.preventDefault();
        content.classList.toggle('show');
      });

      document.addEventListener('click', event => {
        if (!dropdown.contains(event.target)) {
          content.classList.remove('show');
        }
      });

      updateSummary();
    });
  });
</script>
