<script>
document.addEventListener('DOMContentLoaded', () => {
  // --- Dropdowns con checkboxes ---
  document.querySelectorAll('.dropdown').forEach(dropdown => {
    const button = dropdown.querySelector('.dropdown-toggle');
    const content = dropdown.querySelector('.dropdown-content');
    const summary = button ? button.querySelector('.selected-summary') : null;
    const fieldName = dropdown.dataset.field;
    if (!content || !summary || !fieldName) return;

    const selectionOrder = [];
    const orderInput = dropdown.querySelector('.selection-order-input');

    const updateSummary = () => {
      summary.textContent = selectionOrder.map((v, i) => `${i+1}. ${v}`).join(', ');
      if (orderInput) {
        orderInput.value = JSON.stringify(selectionOrder);
      }
    };

    content.querySelectorAll('label').forEach(optionLabel => {
      const value = optionLabel.textContent.trim();
      optionLabel.textContent = '';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.name = fieldName;
      checkbox.value = value;
      const span = document.createElement('span');
      span.textContent = value;
      optionLabel.appendChild(checkbox);
      optionLabel.appendChild(span);

      checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
          if (!selectionOrder.includes(checkbox.value)) selectionOrder.push(checkbox.value);
        } else {
          const idx = selectionOrder.indexOf(checkbox.value);
          if (idx > -1) selectionOrder.splice(idx, 1);
        }
        optionLabel.classList.toggle('selected', checkbox.checked);
        updateSummary();
      });
    });

    content.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
      if (!selectionOrder.includes(cb.value)) selectionOrder.push(cb.value);
    });
    updateSummary();

    const search = content.querySelector('.dropdown-search');
    if (search) {
      search.addEventListener('input', () => {
        const term = search.value.trim().toLowerCase();
        content.querySelectorAll('label').forEach(label => {
          const txt = label.querySelector('span')?.textContent?.toLowerCase() || '';
          label.style.display = txt.includes(term) ? 'block' : 'none';
        });
      });
    }

    if (button) {
      button.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        dropdown.classList.toggle('show');
      });
    }

    document.addEventListener('click', e => {
      if (!dropdown.contains(e.target)) dropdown.classList.remove('show');
    });
  });
