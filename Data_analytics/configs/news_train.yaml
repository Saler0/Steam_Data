## Plantilla de entrenamiento de clasificador de noticias
## Se usa como defaults para el script multimodelo. La CLI tiene prioridad.

# Featurización y validación
featurizer: tfidf              # tfidf | sbert
embedding_model: all-MiniLM-L6-v2  # si featurizer=sbert
svd_dim: 300                   # dimensión tras TF-IDF para modelos densos
cv: 5                          # K-fold en el 80% del train
scoring: f1_macro              # métrica de selección (cv_f1_macro)
models: "svm,logreg,rf,mlp"    # o "all"

# Hiperparámetros por modelo (sklearn)
model_params:
  svm:
    C: 1.0
  logreg:
    C: 1.0
    penalty: l2
    solver: lbfgs
    max_iter: 2000
  rf:
    n_estimators: 500
    max_depth: 20
    random_state: 42
    n_jobs: -1
  mlp:
    hidden_layer_sizes: [256, 128]
    activation: relu
    max_iter: 300
    random_state: 42

