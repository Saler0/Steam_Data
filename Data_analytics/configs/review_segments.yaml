# Configuration for prepare_reviews_with_segments.py
reviews_source: null  # Keep null to load from Mongo by default
review_id_column: review_id
appid_column: appid
text_column: review
date_column: timestamp_created
recommended_column: recommended
playtime_column: playtime_at_review
playtime_30d_column: playtime_since_review_30d
abandon_column: abandon_after_30d
gifted_column: gifted
early_access_column: early_access
post_launch_column: post_launch
median_playtime_column: median_playtime_app
bertopic_language: multilingual
bertopic_min_topic_size: 20

mongo:
  uri: ${MONGO_URI:-mongodb://mongo:27017}
  database: ${MONGO_DB_REVIEWS:-steam}
  collection: ${MONGO_COLL_REVIEWS:-reviews}
  query: {}
  projection: {}
  limit: null

spark:
  enabled: false  # Activate with --use-spark or set to true when Spark is available
  partitions: ${SPARK_REVIEWS_PARTITIONS:-200}
  partition_column: appid
  config:
    spark.sql.shuffle.partitions: ${SPARK_SQL_SHUFFLE_PARTITIONS:-200}
