# Parámetros globales
mongo:
  # En Docker, usa el hostname del servicio en la red (p.ej., 'mongo').
  # En local, puedes sobrescribir con la variable de entorno MONGO_URI.
  uri: mongodb://host.docker.internal:27017
  database: exploitation_zone
  collection: steam_reviews

mlflow:
  experiment_name: "steam_rules_pipeline"
  tracking_uri: "http://mlflow:5000"

# ----------------------
# Report parameters (for DVC report/editor)
# ----------------------
report:
  appid: "12345"
  neighbors_top_k: 15

# ----------------------
# Client report (standalone stage)
# ----------------------
client_report:
  client_id: "client-001"
  client_file: "configs/client_example.json"
  neighbors_top_k: 15
  same_cluster_only: true

# ----------------------
# Clustering params (for DVC cluster_assign)
# ----------------------
clustering:
  # Si null, el script usará el mes actual (YYYYMM)
  cluster_version: 202509

# ----------------------
# Parámetros de reglas
# ----------------------

regla_precio:
  bajo_umbral: 0.10
  alto_umbral: 0.10

justificacion_precio:
  tiempo_jugado_umbral: 0.5    # relativo a mediana
  delta_precio_lanzamiento: 0.05

saturacion_cluster_1:
  vecinos_min: 20
  edad_umbral: 6   # años

saturacion_cluster_2:
  reviews_min: 1000
  desviacion_umbral: 0.15
  nota_media_umbral: 0.70

saturacion_cluster_3:
  vecinos_lanzamiento_umbral: 0.50
  review_positiva_umbral: 0.70

justificacion_actividad:
  cambio_actividad_min: 0.10
  correlacion_parches_umbral: 0.5

experiencia_jugador:
  horas_nuevo: 0.1
  horas_intermedio: 0.5
  horas_experto: 1.5

deteccion_abandono:
  horas_semana_inactivo: 0
  horas_semana_poco_activo: 2
  horas_semana_ocacional: 10
  horas_semana_frecuente: 30

limitaciones_tecnicas:
  ram_umbral: "mediana"
  plataformas_umbral: "mayoria"
  steam_deck_verificado: true
  conexion_constante: true
  tamano_p75: true

evaluacion_limitaciones:
  limite_bajo: 0
  limite_medio: 2
  limite_alto: 3

publishers_estudios:
  pct_publi_potente: 0.50
  pct_dev_potente: 0.50
  pct_ips_famosas: 0.30
  nota_media: 80

prioridad_idiomas:
  ingles_reviews_min: 1000
  espanol_reviews_min: 1000
  espanol_reviews_pct: 0.20
  espanol_reviews_abs: 300
  otro_reviews_min: 1000
  otro_reviews_pct: 0.15
  otro_reviews_abs: 300

cluster_history:
  cluster_id: "12345"
  launch_date: null
  start_date: null
  end_date: null
  min_points: 90



neighbor_strategy:
  target_total: 20
  allow_cross_cluster: true
  k_in: 25
  k_out: 15
  min_similarity_in: 0.0
  min_similarity_out: 0.78
  faiss_index_path: models/embeddings.faiss
  faiss_ids_path: models/emb_ids.json
  max_out_ratio: 0.3
  max_cross_clusters: 20
  rerank:
    alpha_cosine: 1.0
    beta_cluster_penalty: 0.15
    gamma_tag_overlap: 0.10
    delta_monetization: 0.05
    epsilon_mode_match: 0.05
    zeta_name_penalty: 0.20
    name_penalty:
      w_unigram: 1.0
      w_ngram: 1.5
      w_prefix: 1.0
      ngram_sizes: [2, 3]
      min_prefix_length: 6
      generic_whitelist:
        - zombie
        - zombies
        - survival
        - survivor
        - survivors
        - horde
        - fps
        - coop
        - co-op
        - online
        - protocol
        - arena
        - shooter
        - battle
windows:
  time_granularity: monthly
  roll_len_players: 6
  roll_len_reviews: 6
  peak_window_months: 2
  min_peak_separation_months: 2
peaks:
  z_threshold: 2.0
  method: zscore
correlation:
  lags_months: [1, 2]
  prewhitening: true
  fdr: true
real_competitors:
  k_in: 25
  k_out: 15
  min_similarity_in: 0.82
  min_similarity_out: 0.80
  max_out_of_cluster_ratio: 0.30
  filters:
    min_shared_tags: 2
    monetization_compatible: true
    mode_match: [pvp, multiplayer]
  rerank:
    alpha_cosine: 1.0
    beta_cluster_penalty: 0.15
    gamma_tag_overlap: 0.10
    delta_monetization: 0.05
  window:
    start: "2025-01-01"
    end: "2025-09-24"
    today_last_days: 30
    zpeak_threshold: 1.8
    min_points: 90
bertopic:
  scope_cluster: "microsegmento del cluster_id=42"
  scope_competitors: "reviews de competidores reales (today+recent)"
  window:
    start: "2025-01-01"
    end: "2025-09-24"
  min_docs_per_topic: 200
  min_topic_size: 50
  language: "auto/en/es"
  sentiment_model: "distilbert-sentiment-multilingual"
  normalization: [spelling_fix, lemmatize, no_lowercase]
social:
  analysis_mode: peak_micro_daily
  daily_window_days: 14
