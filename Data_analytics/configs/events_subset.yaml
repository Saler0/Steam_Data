output_dir: outputs/events
reports_output_dir: outputs/reports
backend: python
embeddings_parquet: data/processed/embeddings/
clusters_parquet: data/processed/_tmp_neighbors_clusters.parquet
metadata_parquet: data/processed/game_metadata.parquet
neighbors_top_k: 15
neighbors_same_cluster_only: true
neighbors_min_similarity: 0.4
mongo_connection:
  uri: ${MONGO_URI:-mongodb://mongo:27017}
  database: ${MONGO_DB_REVIEWS:-exploitation_zone}
  collection: ${MONGO_COLL_REVIEWS:-steam_reviews}
dlc:
  enabled: true
  mongo_connection:
    uri: ${MONGO_URI:-mongodb://mongo:27017}
    database: ${MONGO_DB_GAMES:-exploitation_zone}
    collection: ${MONGO_COLL_GAMES:-juegos_steam}
mongodb:
  uri: ${MONGO_URI:-mongodb://mongo:27017}
  db_name: ${MONGO_DB_EXPLOITATION:-exploitation_zone}
  collection_name: ${MONGO_COLL_NEWS:-news_games}
preaggregated:
  reviews_monthly: data/warehouse/reviews_monthly.parquet
  players_monthly: data/warehouse/players_monthly.parquet
topics_input_path: outputs/events/topics.parquet
cluster_filter: []
parallelization:
  mode: ray
ray_cluster:
  enabled: true
  address: auto
mlflow:
  enabled: true
  experiment: Steam Analytics
  run_name_prefix: eventos_detect
detection:
  zscore_threshold: 1.4
pairing:
  lags_months:
  - 1
  - 2
bertopic:
  embedding_model: all-MiniLM-L6-v2
  min_df: 5
  min_topic_size: 15
  window_months: 2
  top_n_topics: 3
  weighting:
    enabled: true
    method: log2
    cap: 5
    min_len: 100
  max_docs_per_event: 20000
topics_scoring:
  high_z: 2.0
  penalize_negative: true
  penalize_mixed: true
  degrade_levels: 1
llm:
  enabled: true
  model_id: local-llm
  server_url: http://localhost:8000/v1/chat/completions
  max_new_tokens: 128
  temperature: 0.1
  max_workers: 8
  taxonomy:
  - bugs
  - performance
  - balance
  - price
  - ux
  - story
  - multiplayer
  - endgame
  - innovation
  - content
  - qa/support
  news_labels:
  - patch
  - marketing
  - community
  - other
  mlflow_experiment: news_topics_classification
signals:
  twitch:
    mode: file
    client_id: ${TWITCH_CLIENT_ID}
    client_secret: ${TWITCH_CLIENT_SECRET}
    file: data/external/twitch/monthly_{appid}.csv
    api_cache_dir: data/external/twitch/api_cache
  youtube:
    mode: file
    api_key: ${YOUTUBE_API_KEY}
    file: data/external/youtube/monthly_{appid}.csv
    api_cache_dir: data/external/youtube/api_cache
  steam_updates:
    mode: file
    file: data/external/changelogs/{appid}.json
input_paths:
  clusters_parquet: data/processed/_tmp_neighbors_clusters.parquet
