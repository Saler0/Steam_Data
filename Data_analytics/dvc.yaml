# ----------------------------------------------------------------------------
# Pipeline de Datos de Steam
# Este archivo define las etapas, dependencias y parámetros para el
# flujo de trabajo de análisis de datos con DVC.
# ----------------------------------------------------------------------------
params:
  - configs/params.yaml

vars:
  - configs/params.yaml

stages:
  preagg_reviews:
    cmd: python src/pipelines/preaggregations/reviews_monthly.py --config configs/ccf_analysis.yaml
    deps:
      - src/pipelines/preaggregations/reviews_monthly.py
      - configs/ccf_analysis.yaml
    outs:
      - data/warehouse/reviews_monthly.parquet

  preagg_players:
    cmd: >
      python src/pipelines/preaggregations/players_monthly.py
      --postgres-host $POSTGRES_HOST
      --postgres-port $POSTGRES_PORT
      --postgres-user $POSTGRES_USER
      --postgres-password $POSTGRES_PASSWORD
      --postgres-db $POSTGRES_DB
      --postgres-table exploitation_zone
      --out data/warehouse/players_monthly.parquet
    deps:
      - src/pipelines/preaggregations/players_monthly.py
    outs:
      - data/warehouse/players_monthly.parquet

  # --- Etapa 1: Generación de Embeddings y Características Numéricas ---
  embeddings:
    cmd: python src/pipelines/generate_embeddings.py --config configs/embeddings.yaml
    deps:
      - src/pipelines/generate_embeddings.py
      - configs/embeddings.yaml
    outs:
      - data/processed/embeddings/
      - data/processed/embeddings/embeddings.parquet

  # --- Etapa 2: Agrupación de Juegos (Clustering) ---
  clustering:
    cmd: python src/pipelines/run_clustering.py --config configs/clustering.yaml
    deps:
      - src/pipelines/run_clustering.py
      - configs/clustering.yaml
      - data/processed/embeddings/
    outs:
      - data/processed/clusters.parquet
      - data/processed/game_metadata.parquet
      - models/cluster_medoids.json
    metrics:
      - outputs/clustering/cluster_stats.csv
      - outputs/clustering/borderline_games.csv

  # Perfilado temático de clusters con BERTopic
  cluster_topics_profile:
    cmd: python src/pipelines/cluster_assignment/profile_clusters_topics.py --clusters data/processed/clusters.parquet --metadata data/processed/game_metadata.parquet --mongo-config configs/clustering.yaml --out outputs/clustering/cluster_topics.json --mlflow-enabled --mlflow-experiment ${mlflow.experiment_name} --mlflow-run-name cluster_topics_profile --mlflow-tracking-uri ${mlflow.tracking_uri}
    deps:
      - src/pipelines/cluster_assignment/profile_clusters_topics.py
      - data/processed/clusters.parquet
      - data/processed/game_metadata.parquet
      - configs/clustering.yaml
    outs:
      - outputs/clustering/cluster_topics.json

  cluster_topics_map:
    cmd: python scripts/plot_cluster_topics_umap.py --medoids models/cluster_medoids.json --stats outputs/clustering/cluster_stats.csv --topics outputs/clustering/cluster_topics.json --borderline outputs/clustering/borderline_games.csv --out-html outputs/clustering/cluster_topics_umap.html
    deps:
      - scripts/plot_cluster_topics_umap.py
      - models/cluster_medoids.json
      - outputs/clustering/cluster_stats.csv
      - outputs/clustering/cluster_topics.json
      - outputs/clustering/borderline_games.csv
    outs:
      - outputs/clustering/cluster_topics_umap.html

  # Asignación diaria de nuevos juegos a clusters existentes (sin reentrenar)
  cluster_assign:
    cmd: >
      python -m src.pipelines.cluster_assignment.assign_new_games
        --embeddings data/processed/embeddings_new.parquet
        --medoids models/cluster_medoids.json
        --out data/processed/clusters_assigned.parquet
        --cluster_version ${clustering.cluster_version}
    deps:
      - src/pipelines/cluster_assignment/assign_new_games.py
      - models/cluster_medoids.json
      - data/processed/embeddings_new.parquet
    params:
      - configs/params.yaml:clustering
    outs:
      - data/processed/clusters_assigned.parquet

  # --- Rama Paralela 1: Detección de Eventos e Insights ---
  events:
    cmd: python src/pipelines/event_detection/detect_events.py --config configs/events.yaml
    deps:
      - src/pipelines/event_detection/detect_events.py
      - configs/events.yaml
      - data/warehouse/reviews_monthly.parquet
      - data/warehouse/players_monthly.parquet
      - data/processed/clusters.parquet
    outs:
      - outputs/events/events.parquet

  reviews_with_segments:
    cmd: python src/pipelines/review_segments/prepare_reviews_with_segments.py --config configs/review_segments.yaml --output data/warehouse/reviews_with_segments.parquet --topics-output outputs/events/reviews_topics.parquet --allow-empty
    deps:
      - src/pipelines/review_segments/prepare_reviews_with_segments.py
      - configs/review_segments.yaml
    outs:
      - data/warehouse/reviews_with_segments.parquet
      - outputs/events/reviews_topics.parquet

  topics:
    cmd: python src/insights/topic_motives.py --config configs/events.yaml
    deps:
      - src/insights/topic_motives.py
      - configs/events.yaml
      - outputs/events/events.parquet
    outs:
      - outputs/events/topics.parquet

  review_segments:
    cmd: python src/insights/build_review_segments.py --events outputs/events/events.parquet --reviews data/warehouse/reviews_with_segments.parquet --topics outputs/events/reviews_topics.parquet --output outputs/events/review_segments.parquet
    deps:
      - src/insights/build_review_segments.py
      - outputs/events/events.parquet
      - data/warehouse/reviews_with_segments.parquet
      - outputs/events/reviews_topics.parquet
    outs:
      - outputs/events/review_segments.parquet

  news_classifier:
    cmd: python src/insights/news_classifier.py --config configs/events.yaml
    deps:
      - src/insights/news_classifier.py
      - configs/events.yaml
    outs:
      - outputs/events/news_classified.parquet

  news_train:
    cmd: python src/insights/train_news_classifier.py --input outputs/events/news_classified.parquet --text-cols title,contents --model-out models/news_svm.joblib
    deps:
      - src/insights/train_news_classifier.py
      - outputs/events/news_classified.parquet
    outs:
      - models/news_svm.joblib

  label_topics:
    cmd: python src/insights/label_topics.py --config configs/events.yaml
    deps:
      - src/insights/label_topics.py
      - src/insights/news_classifier.py
      - configs/events.yaml
      - outputs/events/topics.parquet
    outs:
      - outputs/events/topics_labeled.parquet

  enrich:
    cmd: python src/pipelines/event_detection/enrich_events.py --config configs/events.yaml
    deps:
      - src/pipelines/event_detection/enrich_events.py
      - configs/events.yaml
      - outputs/events/events.parquet
      - outputs/events/topics.parquet
      - outputs/events/news_classified.parquet
    outs:
      - outputs/events/explanations.parquet

  # --- Rama Paralela 2: Aplicación y Evaluación de Reglas de Decisión ---
  prepare:
    cmd: python src/pipelines/decision_rules/pipeline.py --stage prepare --config configs/params.yaml
    deps:
      - src/pipelines/decision_rules/pipeline.py
      - src/pipelines/decision_rules/reglas_decision.py
      - data/processed/clusters.parquet
      - outputs/events/events.parquet
      - outputs/events/explanations.parquet
      - configs/params.yaml
    params:
      - configs/params.yaml:
          - mongo
    outs:
      - data/prepared/

  apply_rules:
    cmd: python src/pipelines/decision_rules/pipeline.py --stage apply_rules --config configs/params.yaml
    deps:
      - src/pipelines/decision_rules/pipeline.py
      - src/pipelines/decision_rules/reglas_decision.py
      - data/prepared/
      - data/processed/clusters.parquet
      - configs/params.yaml
    params:
      - configs/params.yaml:
          - regla_precio
          - justificacion_precio
          - saturacion_cluster_1
          - saturacion_cluster_2
          - saturacion_cluster_3
          - justificacion_actividad
          - experiencia_jugador
          - deteccion_abandono
          - limitaciones_tecnicas
          - evaluacion_limitaciones
          - publishers_estudios
          - prioridad_idiomas
    outs:
      - data/with_rules/

  evaluate:
    cmd: python src/pipelines/decision_rules/pipeline.py --stage evaluate --config configs/params.yaml
    deps:
      - src/pipelines/decision_rules/pipeline.py
      - data/with_rules/
      - configs/params.yaml
    params:
      - configs/params.yaml:
          - mlflow
    outs:
      - outputs/reports/metrics.json

  # --- Rama Paralela 3: Análisis de Correlación Cruzada (CCF) ---
  ccf:
    cmd: python src/pipelines/ccf_analysis/analyze_competitors_ccf.py --config configs/ccf_analysis.yaml
    deps:
      - src/pipelines/ccf_analysis/analyze_competitors_ccf.py
      - configs/ccf_analysis.yaml
      - data/warehouse/reviews_monthly.parquet
      - data/warehouse/players_monthly.parquet
    outs:
      # CCF summary es opcional para client_report; el script lo maneja si falta
      - outputs/ccf_analysis/consistency.parquet

  cluster_history:
    cmd: >
      python src/pipelines/cluster_assignment/build_competitor_insights.py
        --cluster-id ${cluster_history.cluster_id}
        --clusters data/processed/clusters.parquet
        --players data/warehouse/players_monthly.parquet
        --events outputs/events/events.parquet
        --topics outputs/events/topics.parquet
        --granger-summary outputs/ccf_analysis/summary.parquet
        --out outputs/clustering/competitors_${cluster_history.cluster_id}.json
        --launch-date ${cluster_history.launch_date}
        --start-date ${cluster_history.start_date}
        --end-date ${cluster_history.end_date}
        --min-points ${cluster_history.min_points}
    deps:
      - src/pipelines/cluster_assignment/build_competitor_insights.py
      - src/pipelines/cluster_assignment/history_analysis.py
      - data/processed/clusters.parquet
      - data/warehouse/players_monthly.parquet
      - outputs/events/events.parquet
      - outputs/events/topics.parquet
      - outputs/ccf_analysis/summary.parquet
    params:
      - configs/params.yaml:cluster_history
    outs:
      - outputs/clustering/competitors_${cluster_history.cluster_id}.json

  # --- Etapa Final: Generación de Informes (Convergencia) ---
  report:
    cmd: >
      python src/insights/build_game_report.py
        --config configs/events.yaml
        --appid ${report.appid}
        --top_k ${report.neighbors_top_k}
    deps:
      - src/insights/build_game_report.py
      - configs/events.yaml
      - data/processed/clusters.parquet
      - outputs/events/events.parquet
      - outputs/events/topics_scored.parquet
      - outputs/events/explanations.parquet
      - outputs/ccf_analysis/summary.parquet
    params:
      - configs/params.yaml:report
    outs:
      - outputs/reports/${report.appid}.json

  editor_view:
    cmd: >
      python src/insights/compose_editor_payload.py
        --appid ${report.appid}
    deps:
      - src/insights/compose_editor_payload.py
      - outputs/reports/${report.appid}.json
    params:
      - configs/params.yaml:report
    outs:
      - outputs/reports/${report.appid}_editor.json

  topics_relevance:
    cmd: >
      python src/insights/score_topics_with_ccf.py --config configs/events.yaml
    deps:
      - src/insights/score_topics_with_ccf.py
      - outputs/events/topics.parquet
      - outputs/events/events.parquet
      - outputs/ccf_analysis/consistency.parquet
    outs:
      - outputs/events/topics_scored.parquet

  client_report:
    cmd: >
      python src/insights/make_client_report.py
        --client_file ${client_report.client_file}
        --top_k ${client_report.neighbors_top_k}
        --same_cluster_only ${client_report.same_cluster_only}
    deps:
      - src/insights/make_client_report.py
      - configs/embeddings.yaml
      - data/processed/embeddings/embeddings.parquet
      - data/processed/clusters.parquet
      - data/processed/game_metadata.parquet
      - outputs/ccf_analysis/summary.parquet
      - outputs/events/events.parquet
      - outputs/events/topics_scored.parquet
      - outputs/events/explanations.parquet
      - outputs/events/review_segments.parquet
      - outputs/clustering/cluster_stats.csv
      - outputs/clustering/cluster_topics.json
    params:
      - configs/params.yaml:client_report
    outs:
      - outputs/reports/client_${client_report.client_id}.json
